name = "2"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Database (Cloudflare D1). First create it with:
#   npx wrangler d1 create video-app-db
# then paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "video-app-db"
database_id = "f8fe2525-b279-4e33-ac91-4cff6ceddcdc"
migrations_dir = "drizzle"

# ---------------------------------------------------------------------------
# Media storage (Cloudflare R2). First create it with:
#   npx wrangler r2 bucket create video-app-media
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "video-app-media"

# ---------------------------------------------------------------------------
# Email sending (Resend). Sender address — you can use this address once
# you've verified the leakedfap.org domain in Resend. The API key is NOT
# written here (to keep it secret) — instead it's added with:
#   npx wrangler secret put RESEND_API_KEY
# ---------------------------------------------------------------------------
[vars]
EMAIL_FROM = "LeakedFap <notifications@leakedfap.org>"
